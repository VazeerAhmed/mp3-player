<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AutoVerse | Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #000; --glass: rgba(255, 255, 255, 0.05);
            --accent: #00d9ff; --border: rgba(255, 255, 255, 0.1);
            --text: #fff; --text-dim: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* GRID SYSTEM FOR LANDSCAPE/DESKTOP */
        @media (min-width: 850px) or (orientation: landscape) {
            .main-content {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 25px;
                align-items: stretch;
                height: 600px;
            }
            .music-player, .playlist-section {
                height: 100%;
                margin: 0;
            }
            .toggle-buttons {
                display: flex !important;
            }
        }

        /* Top Sections */
        .language-tabs { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 15px; scrollbar-width: none; }
        .language-tab { 
            background: var(--glass); 
            border: 1px solid var(--border); 
            padding: 10px 18px; 
            border-radius: 20px; 
            cursor: pointer; 
            white-space: nowrap; 
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .language-tab.active { background: var(--accent); color: #000; font-weight: bold; }

        .search-container { position: relative; margin-bottom: 10px; }
        .search-input { 
            width: 100%; 
            padding: 14px; 
            background: var(--glass); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            color: #fff; 
            outline: none; 
        }
        .suggestions-box { 
            position: absolute; 
            top: 110%; 
            left: 0; 
            right: 0; 
            background: #111; 
            border-radius: 12px; 
            z-index: 99; 
            display: none; 
            border: 1px solid var(--border);
            max-height: 400px;
            overflow-y: auto;
        }

        /* Search Type Tabs */
        .search-type-tabs {
            display: flex;
            gap: 5px;
            padding: 8px;
            background: #0a0a0a;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .search-type-tab {
            flex: 1;
            padding: 6px 10px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            text-align: center;
            transition: all 0.3s;
        }

        .search-type-tab.active {
            background: var(--accent);
            color: #000;
            font-weight: bold;
        }

        .suggestion-item {
            display: flex;
            gap: 10px;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .suggestion-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .suggestion-item img {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
        }

        .suggestion-info {
            flex: 1;
            overflow: hidden;
        }

        .suggestion-title {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggestion-meta {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 2px;
        }

        /* Music Player */
        .music-player { 
            background: var(--glass); 
            border: 1px solid var(--border); 
            border-radius: 24px; 
            padding: 30px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            min-width: 0;
            width: 100%;
            box-sizing: border-box;
        }

        /* Album Art / Display Area */
        .display-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            max-width: 280px;
            margin: 0 auto 20px;
        }

        .album-art { 
            width: 100%; 
            height: 100%; 
            border-radius: 18px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,217,255,0.2);
            transition: opacity 0.3s, transform 0.3s;
        }
        .album-art img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* Overlay Pane for Queue/Lyrics/Info */
        .overlay-pane {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(15px);
            border-radius: 18px;
            border: 1px solid var(--border);
            padding: 15px;
            display: none;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s, transform 0.3s;
            
        }

        .overlay-pane.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .overlay-header {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0.8;
            
        }

        .overlay-content {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scroll-behavior: smooth;
        }

        /* SYNCED LYRICS STYLING */
        .lyrics-content {
            line-height: 1.8;
            font-size: 1.1rem;
            color: var(--text-dim);
            text-align: center;
            padding-bottom: 50%;
            
        }

        .lyric-line {
            padding: 12px 5px;
            transition: all 0.3s ease;
            opacity: 0.3;
            cursor: pointer;
            border-radius: 8px;
        }

        .lyric-line.active {
            opacity: 1;
            color: var(--accent);
            transform: scale(1.08);
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.4);
        }

        .lyrics-content.no-lyrics {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            opacity: 0.5;
        }

        /* Song Info styling */
        .info-content {
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-dim);
            opacity: 0.7;
        }

        .info-value {
            color: var(--text);
            font-weight: 500;
            text-align: right;
            max-width: 60%;
            word-wrap: break-word;
            font-size: 0.75rem;
        }

        /* Toggle Buttons */
        .toggle-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .toggle-btn {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
            text-align: center;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #000;
            font-weight: bold;
        }

        /* Hide overlay and show album art by default */
        body:not(.show-queue):not(.show-lyrics):not(.show-info) .album-art {
            opacity: 1;
        }

        body.show-queue .overlay-pane.queue-pane,
        body.show-lyrics .overlay-pane.lyrics-pane,
        body.show-info .overlay-pane.info-pane {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        body.show-queue .album-art,
        body.show-lyrics .album-art,
        body.show-info .album-art {
            opacity: 0;
            pointer-events: none;
        }

        /* Draggable progress bar */
        .progress-wrap {
            width: 100%;
            margin: 18px 0 8px;
            position: relative;
        }
        .progress-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            display: block;
            background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--prog, 0%), #333 var(--prog, 0%), #333 100%);
        }
        .progress-range:hover { height: 7px; }
        .progress-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,217,255,0.7);
        }
        .progress-range::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(0,217,255,0.7);
        }

        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 30px; 
            margin-bottom: 20px; 
        }
        
        .control-btn { 
            cursor: pointer; 
            font-size: 1.4rem;
            transition: all 0.3s;
            color: var(--text);
        }
        .control-btn:hover {
            color: var(--accent);
            transform: scale(1.1);
        }

        .play-btn { 
            background: var(--accent); 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #000; 
            font-size: 1.6rem; 
            cursor: pointer;
            transition: all 0.3s;
        }
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }
        
        .volume-control { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            width: 80%; 
            margin: 0 auto 15px; 
            opacity: 0.6; 
        }
        .volume-slider { 
            flex: 1; 
            accent-color: var(--accent); 
            cursor: pointer; 
        }

        /* Auto-Recommendation Toggle */
        .auto-rec-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .toggle-switch {
            position: relative;
            width: 42px;
            height: 22px;
            background: #333;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: var(--accent);
        }

        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(20px);
        }

        /* Playlist Section */
        .playlist-section { 
            background: var(--glass); 
            border: 1px solid var(--border); 
            border-radius: 24px; 
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        /* Hide on mobile portrait, show on landscape/desktop */
        @media (max-width: 849px) and (orientation: portrait) {
            .playlist-section {
                display: none;
            }
        }
        
        .playlist-section h4 { 
            margin-bottom: 15px; 
            opacity: 0.8; 
            font-size: 1rem; 
        }
        .playlist-list { 
            flex: 1; 
            overflow-y: auto; 
            scrollbar-width: thin; 
        }

        .track-item { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 10px; 
            cursor: pointer; 
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .track-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border);
        }
        .track-item.active { 
            background: var(--accent); 
            color: #000;
            border-color: var(--accent);
        }
        .track-item img { 
            width: 45px; 
            height: 45px; 
            border-radius: 6px;
            object-fit: cover;
        }

        .loader { 
            display: none; 
            text-align: center; 
            color: var(--accent); 
            padding: 10px; 
            font-size: 0.8rem; 
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="language-tabs">
            <div class="language-tab active" id="tab-hindi" onclick="loadTrendingPlaylist('hindi')">🇮🇳 Hindi</div>
            <div class="language-tab" id="tab-telugu" onclick="loadTrendingPlaylist('telugu')">🌟 Telugu</div>
            <div class="language-tab" id="tab-english" onclick="loadTrendingPlaylist('english')">🌎 English</div>
            <div class="language-tab" id="tab-tamil" onclick="loadTrendingPlaylist('tamil')">🎭 Tamil</div>
            <div class="language-tab" id="tab-punjabi" onclick="loadTrendingPlaylist('punjabi')">🎪 Punjabi</div>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" id="searchInp" placeholder="Search Songs, Albums, Playlists..." oninput="getSuggestions(this.value)">
            <div class="suggestions-box" id="sugBox"></div>
        </div>
    </div>

    <div class="main-content">
        <div class="music-player">
            <div class="display-container">
                <div class="album-art">
                    <img id="mainImg" src="" alt="Album Art">
                </div>
                
                <div class="overlay-pane queue-pane">
                    <div class="overlay-header">Up Next</div>
                    <div class="overlay-content" id="queueOverlay"></div>
                </div>

                <div class="overlay-pane lyrics-pane">
                    <div class="overlay-header">Lyrics</div>
                    <div class="overlay-content" id="lyricsScroll">
                        <div class="lyrics-content" id="lyricsContent">
                            <div class="no-lyrics">Select a song to view lyrics</div>
                        </div>
                    </div>
                </div>

                <div class="overlay-pane info-pane">
                    <div class="overlay-header">Song Info</div>
                    <div class="overlay-content">
                        <div class="info-content" id="infoContent">
                            <div class="no-lyrics">Select a song to view details</div>
                        </div>
                    </div>
                </div>
            </div>

            <div style="text-align:center; width:100%; max-width:100%; margin-bottom:10px; min-width:0; padding:0 4px; overflow:hidden;">
                <h2 id="mainTitle" style="font-size:1.15rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; display:block; margin-bottom:4px;">AutoVerse</h2>
                <p id="mainArtist" style="color:var(--text-dim); font-size:0.78rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; display:block; margin-bottom:5px;">Select a song</p>
            </div>

            <div class="toggle-buttons">
                <div class="toggle-btn" id="queueBtn" onclick="toggleView('queue')">Queue</div>
                <div class="toggle-btn" id="lyricsBtn" onclick="toggleView('lyrics')">Lyrics</div>
                <div class="toggle-btn" id="infoBtn" onclick="toggleView('info')">Info</div>
            </div>

            <div class="progress-wrap">
                <input type="range" id="progressRange" class="progress-range" min="0" max="1000" value="0" step="1" oninput="seekRange(this.value)">
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-dim); margin-bottom:15px; padding:0 2px;">
                <span id="curTime">0:00</span>
                <span id="durTime">0:00</span>
            </div>

            <div class="controls">
                <i class="fas fa-backward-step control-btn" onclick="prev()"></i>
                <div class="play-btn" onclick="toggle()">
                    <i id="playIcon" class="fas fa-play"></i>
                </div>
                <i class="fas fa-forward-step control-btn" onclick="next()"></i>
            </div>

            <div class="volume-control">
                <i class="fas fa-volume-low"></i>
                <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="0.7" oninput="changeVol(this.value)">
                <i class="fas fa-volume-high"></i>
            </div>

            <div class="auto-rec-toggle">
                <span style="opacity: 0.7;">Auto Recommendations</span>
                <div class="toggle-switch active" id="autoRecSwitch" onclick="toggleAutoRec()">
                    <div class="toggle-slider"></div>
                </div>
            </div>
        </div>

        <div class="playlist-section">
            <h4>Up Next</h4>
            <div id="radioLoader" class="loader">
                <i class="fas fa-spinner fa-spin"></i> Discovery Engine...
            </div>
            <div class="playlist-list" id="playlistList"></div>
        </div>
    </div>
</div>

<audio id="audio"></audio>

<script>
    const audio = document.getElementById('audio');
    const API = "https://jiosaavn-api-privatecvc2.vercel.app";
    const langMap = { hindi:'hindi', telugu:'telugu', english:'english', tamil:'tamil', punjabi:'punjabi' };

    // Normalize songs from the jiosaavn API (uses .link) to the format this app expects (.url)
    function normalizeSong(s) {
        if (!s) return s;
        // Normalize image array
        if (s.image && s.image[0] && s.image[0].link && !s.image[0].url) {
            s.image = s.image.map(img => ({ ...img, url: img.link }));
        }
        // Normalize downloadUrl array
        if (s.downloadUrl && s.downloadUrl[0] && s.downloadUrl[0].link && !s.downloadUrl[0].url) {
            s.downloadUrl = s.downloadUrl.map(d => ({ ...d, url: d.link }));
        }
        // The working API puts songs under track instead of directly — flatten if needed
        return s;
    }
    function normalizeSongs(arr) { return (arr || []).map(normalizeSong); }

    // Wrap fetch calls to the working API — it returns {data:{results:[]}} without .success
    async function apiFetch(path) {
        const res = await fetch(API + path);
        const json = await res.json();
        // Normalize to {success, data} shape
        if (!('success' in json)) json.success = true;
        if (json.data !== undefined) {
            if (Array.isArray(json.data)) {
                // e.g. suggestions endpoint returns data as array
                json.data = normalizeSongs(json.data);
            } else if (json.data && json.data.results) {
                json.data.results = normalizeSongs(json.data.results);
            } else if (json.data && json.data.songs) {
                json.data.songs = normalizeSongs(json.data.songs);
            }
        } else if (Array.isArray(json)) {
            return { success: true, data: normalizeSongs(json) };
        }
        return json;
    }

    let playlist = [];
    let currentIndex = 0;
    let currentLang = 'telugu';
    let loadedIds = new Set();
    let loadedTitleKeys = new Set(); // dedup by title+artist to avoid version duplicates
    let isFetching = false;
    let sTimer;
    let currentSongData = null;
    let currentActiveView = null;
    let parsedLyrics = [];
    let autoRecommendations = true;
    let isAlbumPlaylist = false;
    let albumComplete = false;
    let radioFetchCount = 0; // track how many batches fetched

    const trendingPlaylists = {
        hindi:   { query: "hindi hits 2025",          lang: "hindi"   },
        telugu:  { query: "telugu latest hits 2025",   lang: "telugu"  },
        english: { query: "top english hits 2025",     lang: "english" },
        tamil:   { query: "tamil hits 2025",           lang: "tamil"   },
        punjabi: { query: "punjabi hits 2025",         lang: "punjabi" }
    };

    // ── Utility helpers ──────────────────────────────────────────────────────

    function decodeHTML(str) {
        if (!str) return '';
        const t = document.createElement('textarea');
        t.innerHTML = str;
        return t.value;
    }

    function cleanTitle(str) {
        return decodeHTML(str)
            .replace(/\s*[-–]\s*(Telugu|Hindi|Tamil|English|Punjabi|Kannada|Malayalam|Marathi|Bengali)\s*$/i, '')
            .trim();
    }

    function cleanArtist(str) { return decodeHTML(str); }

    function getArtistName(song) {
        if (song.artists?.primary?.length > 0) return song.artists.primary.map(a => a.name).join(', ');
        if (song.primaryArtists) return song.primaryArtists;
        return song.artist || song.singers || 'Unknown Artist';
    }

    function getAlbumArtist(a) {
        if (a.artists?.primary?.length > 0) return a.artists.primary.map(x => x.name).join(', ');
        if (a.artists?.all?.length > 0)     return a.artists.all[0].name;
        if (typeof a.artists === 'string')  return a.artists;
        return a.artist || a.primaryArtists || 'Various Artists';
    }

    function getAlbumName(song) {
        if (song.album?.name) return song.album.name;
        if (typeof song.album === 'string') return song.album;
        return '';
    }

    function getTitleKey(s) {
        const title  = cleanTitle(s.name || s.title || '').toLowerCase().replace(/\s+/g, ' ').trim();
        const artist = getArtistName(s).split(',')[0].toLowerCase().trim();
        return `${title}||${artist}`;
    }

    function formatNumber(num) {
        if (!num) return 'N/A';
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000)    return (num / 1000).toFixed(1) + 'K';
        return num.toString();
    }

    // ── UI State ─────────────────────────────────────────────────────────────

    function toggleView(view) {
        const body = document.body;
        const queueBtn = document.getElementById('queueBtn');
        const lyricsBtn = document.getElementById('lyricsBtn');
        const infoBtn = document.getElementById('infoBtn');

        if (currentActiveView === view) {
            body.classList.remove('show-queue', 'show-lyrics', 'show-info');
            queueBtn.classList.remove('active');
            lyricsBtn.classList.remove('active');
            infoBtn.classList.remove('active');
            currentActiveView = null;
            return;
        }

        body.classList.remove('show-queue', 'show-lyrics', 'show-info');
        queueBtn.classList.remove('active');
        lyricsBtn.classList.remove('active');
        infoBtn.classList.remove('active');

        currentActiveView = view;

        if (view === 'queue') {
            body.classList.add('show-queue');
            queueBtn.classList.add('active');
            scrollActiveToTop();
        } else if (view === 'lyrics') {
            body.classList.add('show-lyrics');
            lyricsBtn.classList.add('active');
        } else if (view === 'info') {
            body.classList.add('show-info');
            infoBtn.classList.add('active');
            if (currentSongData) displaySongInfo(currentSongData);
        }
    }

    function scrollActiveToTop() {
        setTimeout(() => {
            const activeItems = document.querySelectorAll('.track-item.active');
            activeItems.forEach(item => {
                item.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        }, 100);
    }

    function toggleAutoRec() {
        autoRecommendations = !autoRecommendations;
        const toggleSwitch = document.getElementById('autoRecSwitch');
        if (autoRecommendations) {
            toggleSwitch.classList.add('active');
        } else {
            toggleSwitch.classList.remove('active');
        }
    }

    function updateMediaSession(song) {
        if ('mediaSession' in navigator) {
            const artistName = getArtistName(song);
            const albumName = getAlbumName(song) || 'AutoVerse';
            
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.name || song.title,
                artist: artistName,
                album: albumName,
                artwork: [
                    { src: song.image[0].url, sizes: '96x96', type: 'image/jpeg' },
                    { src: song.image[1]?.url || song.image[0].url, sizes: '128x128', type: 'image/jpeg' },
                    { src: song.image[2]?.url || song.image[0].url, sizes: '192x192', type: 'image/jpeg' },
                    { src: song.image[song.image.length-1].url, sizes: '512x512', type: 'image/jpeg' }
                ]
            });

            navigator.mediaSession.setActionHandler('play', () => audio.play());
            navigator.mediaSession.setActionHandler('pause', () => audio.pause());
            navigator.mediaSession.setActionHandler('previoustrack', () => prev());
            navigator.mediaSession.setActionHandler('nexttrack', () => next());
        }
    }

    async function fetchLyrics(songTitle, artistName) {
        const lyricsContent = document.getElementById('lyricsContent');
        lyricsContent.innerHTML = '<div class="no-lyrics"><i class="fas fa-spinner fa-spin"></i> Finding Synced Lyrics...</div>';
        lyricsContent.classList.add('no-lyrics');
        parsedLyrics = [];

        const cleanSong = songTitle.replace(/\(.*\)|\[.*\]/g, "").trim();
        const cleanArtist = artistName.split(',')[0].trim();
        const url = `https://lrclib.net/api/search?artist_name=${encodeURIComponent(cleanArtist)}&track_name=${encodeURIComponent(cleanSong)}`;

        try {
            const response = await fetch(url);
            const results = await response.json();

            if (results && results.length > 0) {
                const track = results[0];
                const lyricsData = track.syncedLyrics || track.plainLyrics;
                if (lyricsData) {
                    renderLyrics(lyricsData);
                    return;
                }
            }
            throw new Error("Not found");
        } catch (error) {
            lyricsContent.innerHTML = '<div class="no-lyrics"><i class="fas fa-music"></i><br>No lyrics available</div>';
        }
    }

    function renderLyrics(rawText) {
        const container = document.getElementById('lyricsContent');
        container.innerHTML = "";
        container.classList.remove('no-lyrics');
        parsedLyrics = [];

        const lines = rawText.split('\n');
        const timeRegex = /\[(\d{2}):(\d{2}\.\d{2,3})\]/;

        lines.forEach((line, index) => {
            const match = timeRegex.exec(line);
            if (match) {
                const minutes = parseInt(match[1]);
                const seconds = parseFloat(match[2]);
                const time = minutes * 60 + seconds;
                const text = line.replace(timeRegex, "").trim();

                if (text) {
                    const lyricEl = document.createElement('div');
                    lyricEl.classList.add('lyric-line');
                    lyricEl.innerText = text;
                    lyricEl.onclick = () => { audio.currentTime = time; };
                    container.appendChild(lyricEl);
                    parsedLyrics.push({ time, element: lyricEl });
                }
            } else if (line.trim() !== "") {
                const p = document.createElement('div');
                p.classList.add('lyric-line');
                p.style.opacity = "1";
                p.innerText = line;
                container.appendChild(p);
            }
        });
    }

    async function loadTrendingPlaylist(lang) {
        currentLang = lang;
        isAlbumPlaylist = false;
        albumComplete = false;
        document.querySelectorAll('.language-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${lang}`).classList.add('active');

        const { query } = trendingPlaylists[lang];
        try {
            const data = await apiFetch(`/search/songs?query=${encodeURIComponent(query)}&limit=20`);
            if (data.success) {
                const allResults = data.data.results || [];
                // English songs often lack language field or have inconsistent values — don't hard-filter
                if (lang === 'english') {
                    playlist = allResults;
                } else {
                    const filtered = allResults.filter(s => !s.language || s.language.toLowerCase() === lang);
                    playlist = filtered.length > 0 ? filtered : allResults;
                }
                loadedIds.clear(); loadedTitleKeys.clear();
                playlist.forEach(s => { loadedIds.add(s.id); loadedTitleKeys.add(getTitleKey(s)); });
                render();
                loadSongUI(0);
                if (autoRecommendations && playlist.length > 0) {
                    setTimeout(() => fetchRadio(playlist[0].id), 800);
                }
            }
        } catch(e) { console.error('loadTrendingPlaylist error:', e); }
    }

    // ── Search & Suggestions ─────────────────────────────────────────────────

    let lastSearchQuery = '';

    // Score a title against the query — higher = better match
    function matchScore(rawTitle, query) {
        // Strip HTML entities, language suffix, and parenthetical "(From ...)" before comparing
        const t = cleanTitle(rawTitle).replace(/\s*\(.*?\)/g, '').toLowerCase().trim();
        const q = query.toLowerCase().trim();
        if (!t || !q) return 0;
        if (t === q)               return 100;
        if (t.startsWith(q + ' ') || t.startsWith(q)) return 85;
        if (t.includes(' ' + q + ' ') || t.endsWith(' ' + q)) return 70;
        if (t.includes(q))         return 50;
        // word-level overlap
        const qWords = q.split(/\s+/).filter(Boolean);
        const tWords = t.split(/\s+/).filter(Boolean);
        const matched = qWords.filter(w => tWords.some(tw => tw === w || tw.startsWith(w))).length;
        return matched > 0 ? Math.round(10 + (matched / qWords.length) * 30) : 0;
    }

    function sortByRelevance(results, query) {
        return [...results].sort((a, b) => {
            const ta = a.name || a.title || '';
            const tb = b.name || b.title || '';
            return matchScore(tb, query) - matchScore(ta, query);
        });
    }

    async function getSuggestions(q) {
        const box = document.getElementById('sugBox');
        if (q.length < 2) { box.style.display = 'none'; return; }
        lastSearchQuery = q;
        clearTimeout(sTimer);
        sTimer = setTimeout(async () => {
            try {
                // Fetch page 1 AND page 2 for songs to get more candidates to re-rank
                const [s1, s2, albumsData, playlistsData] = await Promise.all([
                    apiFetch(`/search/songs?query=${encodeURIComponent(q)}&limit=20&page=1`),
                    apiFetch(`/search/songs?query=${encodeURIComponent(q)}&limit=20&page=2`),
                    apiFetch(`/search/albums?query=${encodeURIComponent(q)}&limit=8&page=1`),
                    apiFetch(`/search/playlists?query=${encodeURIComponent(q)}&limit=6&page=1`)
                ]);

                // Merge page1 + page2, deduplicate by id
                const allSongResults = [...(s1?.data?.results || [])];
                const seenIds = new Set(allSongResults.map(s => s.id));
                (s2?.data?.results || []).forEach(s => { if (!seenIds.has(s.id)) { seenIds.add(s.id); allSongResults.push(s); } });

                const songsData = { success: true, data: { results: sortByRelevance(allSongResults, q).slice(0, 6) } };

                if (albumsData?.success && albumsData.data?.results) {
                    albumsData.data.results = sortByRelevance(albumsData.data.results, q).slice(0, 3);
                }
                if (playlistsData?.success && playlistsData.data?.results) {
                    playlistsData.data.results = sortByRelevance(playlistsData.data.results, q).slice(0, 3);
                }

                renderSearchResults(songsData, albumsData, playlistsData, q);
            } catch(e) { console.error('Search error:', e); }
        }, 300);
    }

    // "View All Songs" — fetch pages 1+2 (up to 40), re-rank, show all
    async function viewAllSongs(q) {
        const box = document.getElementById('sugBox');
        box.innerHTML = `<div style="padding:12px;text-align:center;color:var(--accent)"><i class="fas fa-spinner fa-spin"></i> Loading all results...</div>`;
        try {
            const [r1, r2] = await Promise.all([
                apiFetch(`/search/songs?query=${encodeURIComponent(q)}&limit=50&page=1`),
                apiFetch(`/search/songs?query=${encodeURIComponent(q)}&limit=50&page=2`)
            ]);
            const all = [...(r1?.data?.results || [])];
            const seen = new Set(all.map(s => s.id));
            (r2?.data?.results || []).forEach(s => { if (!seen.has(s.id)) { seen.add(s.id); all.push(s); } });
            const sorted = sortByRelevance(all, q);
            if (sorted.length === 0) { box.innerHTML = '<div style="padding:20px;text-align:center;opacity:0.5;">No results found</div>'; return; }
            const safeQ = q.replace(/'/g, "\\'");
            box.innerHTML =
                `<div style="padding:8px 12px;font-size:0.7rem;color:var(--accent);background:rgba(0,0,0,0.6);letter-spacing:1.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;">
                    <span>ALL SONGS (${sorted.length})</span>
                    <span onclick="getSuggestions('${safeQ}');document.getElementById('searchInp').value='${safeQ}'" style="cursor:pointer;opacity:0.7;font-size:0.65rem;">← Back</span>
                </div>` +
                sorted.map(s => {
                    const title  = cleanTitle(s.name || s.title);
                    const artist = cleanArtist(getArtistName(s));
                    return `<div class="suggestion-item" onclick="startSearchSong('${s.id}')">
                        <img src="${s.image?.[1]?.url || s.image?.[0]?.url || ''}" onerror="this.style.background='#333'">
                        <div class="suggestion-info">
                            <div class="suggestion-title">${title}</div>
                            <div class="suggestion-meta">${artist}${s.year ? ' · ' + s.year : ''}</div>
                        </div>
                    </div>`;
                }).join('');
            box.style.display = 'block';
        } catch(e) { console.error(e); }
    }

        let songsHTML = '';

                </div>` +

        let albumsHTML = '';

                albumsData.data.results.map(a => {

                    const count  = a.songCount || a.songs_count || a.song_count || '';
                    const meta   = [artist, count ? count + ' songs' : null, a.year || null].filter(Boolean).join(' · ');

        let playlistsHTML = '';

                playlistsData.data.results.map(p => {
                    const title = cleanTitle(p.name || p.title);
                    const count = p.songCount || p.songs_count || '';
                    // Pass both id and permaUrl so loadPlaylist can try multiple strategies
                    const safeUrl = encodeURIComponent(p.url || p.permaUrl || p.permalink_url || '');
                    return `<div class="suggestion-item" onclick="loadPlaylist('${p.id}','${safeUrl}')">

    // ── Album / Playlist / Song loaders ─────────────────────────────────────

    async function loadAlbum(albumId) {
        document.getElementById('sugBox').style.display = 'none';
        document.getElementById('searchInp').value = '';
        try {
            const json = await apiFetch(`/albums?id=${albumId}`);
            if (json.success && json.data) {
                isAlbumPlaylist = true;
                albumComplete = false;
                // API may return songs directly or nested
                const songs = normalizeSongs(json.data.songs || json.data.tracks || []);
                if (songs.length === 0) {
                    console.warn('Album has no songs in API response:', json.data);
                    return;
                }
                playlist = songs;
                loadedIds.clear(); loadedTitleKeys.clear();
                playlist.forEach(s => { loadedIds.add(s.id); loadedTitleKeys.add(getTitleKey(s)); });
                currentIndex = 0;
                render();
                play(0);
            }
        } catch (error) { console.error('loadAlbum error:', error); }
    }

    async function loadPlaylist(playlistId, encodedUrl) {
        document.getElementById('sugBox').style.display = 'none';
        document.getElementById('searchInp').value = '';
        document.getElementById('radioLoader').style.display = 'block';

        // Try to extract the token from the permaUrl if we have it
        // JioSaavn URLs look like: /featured/name/TOKEN or /s/playlist/hash/name/TOKEN
        let token = null;
        if (encodedUrl) {
            const url = decodeURIComponent(encodedUrl);
            const m = url.match(/\/([^/]+)\s*$/) || url.match(/\/([A-Za-z0-9_,\-]+)$/);
            if (m) token = m[1];
        }

        const attempts = [
            // Attempt 1: direct numeric id
            () => apiFetch(`/playlists?id=${playlistId}`),
            // Attempt 2: listid param (some API versions use this)
            () => apiFetch(`/playlists?listid=${playlistId}`),
            // Attempt 3: token from URL
            token ? () => apiFetch(`/playlists?id=${token}`) : null,
            // Attempt 4: search for songs from this playlist by name — fallback using the name from search
            null
        ].filter(Boolean);

        for (const attempt of attempts) {
            try {
                const json = await attempt();
                if (json.success && json.data) {
                    const songs = normalizeSongs(json.data.songs || json.data.tracks || []);
                    if (songs.length > 0) {
                        isAlbumPlaylist = true;
                        albumComplete   = false;
                        playlist = songs;
                        loadedIds.clear(); loadedTitleKeys.clear();
                        playlist.forEach(s => { loadedIds.add(s.id); loadedTitleKeys.add(getTitleKey(s)); });
                        currentIndex = 0;
                        render();
                        play(0);
                        document.getElementById('radioLoader').style.display = 'none';
                        return;
                    }
                }
            } catch(e) { /* try next */ }
        }

        // All API attempts failed — show user-friendly error
        document.getElementById('radioLoader').style.display = 'none';
        const box = document.getElementById('sugBox');
        box.style.display = 'block';
        box.innerHTML = `<div style="padding:16px 12px;text-align:center;color:#ff6b6b;">
            <i class="fas fa-exclamation-circle"></i> Couldn't load playlist songs.<br>
            <span style="font-size:0.75rem;opacity:0.7;">Try searching for individual songs instead.</span>
        </div>`;
    }

    async function startSearchSong(id) {
        document.getElementById('sugBox').style.display = 'none';
        document.getElementById('searchInp').value = '';
        isAlbumPlaylist = false;
        albumComplete = false;
        try {
            const data = await apiFetch(`/songs?id=${id}`);
            if(data.success && data.data) {
                const rawSong = Array.isArray(data.data) ? data.data[0] : (data.data[0] || data.data);
                const song = normalizeSong(rawSong);
                // Lock recommendations to this song's language
                if (song.language && langMap[song.language.toLowerCase()]) {
                    currentLang = song.language.toLowerCase();
                }
                playlist = [song];
                loadedIds.clear(); loadedTitleKeys.clear();
                loadedIds.add(song.id);
                loadedTitleKeys.add(getTitleKey(song));
                currentIndex = 0;
                play(0);
                if (autoRecommendations) fetchRadio(song.id);
            }
        } catch(e) { console.error('startSearchSong error:', e); }
    }

    // ── Smart Recommendations ─────────────────────────────────────────────────
    // Fetches a batch of 5 songs. Called only when:
    //  a) ≤5 songs remain in queue
    //  b) Current song has < 60s left
    //  c) User presses next on the last song
    const RADIO_BATCH = 5;

    async function fetchRadio(songId) {
        if (!autoRecommendations || isAlbumPlaylist) return;
        if (isFetching) return;
        isFetching = true;
        document.getElementById('radioLoader').style.display = 'block';
        const isEnglish = currentLang === 'english';
        try {
            let freshSongs = [];

            // Step 1: suggestions endpoint
            try {
                const json = await apiFetch(`/songs/suggestions?id=${songId}&limit=15`);
                const suggData = Array.isArray(json.data) ? json.data : (json.data?.results || []);
                if (json.success && suggData.length > 0) {
                    const candidates = suggData.filter(s => s.id && !loadedIds.has(s.id) && !loadedTitleKeys.has(getTitleKey(s)));
                    if (isEnglish) {
                        freshSongs = candidates;
                    } else {
                        const langF = candidates.filter(s => !s.language || s.language.toLowerCase() === currentLang);
                        freshSongs = langF.length >= 3 ? langF : candidates;
                    }
                }
            } catch(e) { /* fall through */ }

            // Step 2: search-based fallback
            if (freshSongs.length < RADIO_BATCH) {
                const song       = playlist.find(s => s.id === songId) || currentSongData;
                const artistName = song ? getArtistName(song).split(',')[0].trim() : '';
                const { query: langQ } = trendingPlaylists[currentLang] || trendingPlaylists.hindi;
                const queries = [
                    artistName ? `${artistName} ${currentLang}` : null,
                    langQ
                ].filter(Boolean);

                for (const q of queries) {
                    if (freshSongs.length >= RADIO_BATCH * 2) break;
                    try {
                        const json = await apiFetch(`/search/songs?query=${encodeURIComponent(q)}&limit=20`);
                        if (json.success && json.data?.results) {
                            const lang = currentLang;
                            freshSongs.push(...normalizeSongs(json.data.results).filter(s => {
                                if (!s.id || loadedIds.has(s.id) || loadedTitleKeys.has(getTitleKey(s))) return false;
                                if (isEnglish) return true;
                                return !s.language || s.language.toLowerCase() === lang;
                            }));
                        }
                    } catch(e) { /* skip */ }
                }
            }

            // Add only first RADIO_BATCH unique songs (dedup by ID AND title+artist)
            let added = 0;
            for (const s of freshSongs) {
                if (added >= RADIO_BATCH) break;
                const key = getTitleKey(s);
                if (!loadedIds.has(s.id) && !loadedTitleKeys.has(key)) {
                    loadedIds.add(s.id);
                    loadedTitleKeys.add(key);
                    playlist.push(s);
                    added++;
                }
            }

            render();
            if (albumComplete && added > 0) {
                albumComplete = false;
                next();
            }
        } catch(e) { console.error('fetchRadio error:', e); } finally {
            isFetching = false;
            document.getElementById('radioLoader').style.display = 'none';
        }
    }

    function shouldPrefetch() {
        // Fetch more if ≤5 songs left in queue
        return playlist.length - currentIndex <= 5;
    }

    // ── Playback ─────────────────────────────────────────────────────────────

    function loadSongUI(index) {
        if (!playlist[index]) return;
        currentIndex = index;
        const s = playlist[index];
        currentSongData = s;
        const title  = cleanTitle(s.name || s.title);
        const artist = cleanArtist(getArtistName(s));
        const album  = cleanTitle(getAlbumName(s));
        document.getElementById('mainTitle').innerText  = title;
        document.getElementById('mainArtist').innerText = artist + (album ? ' · ' + album : '');
        document.getElementById('mainImg').src = s.image[s.image.length-1].url;
        audio.src = s.downloadUrl[s.downloadUrl.length-1].url;
        updateMediaSession(s);
        fetchLyrics(title, artist);
        render();
        scrollActiveToTop();
    }

    function play(index) {
        loadSongUI(index);
        audio.play().catch(e => console.log(e));
        document.getElementById('playIcon').className = "fas fa-pause";
        if (autoRecommendations && !isAlbumPlaylist && shouldPrefetch()) {
            fetchRadio(playlist[index].id);
        }
    }

    function render() {
        const trackHTML = playlist.map((s, i) => `
            <div id="track-${i}" class="track-item ${i === currentIndex ? 'active' : ''}" onclick="play(${i})">
                <img src="${s.image[0].url}" onerror="this.style.background='#222'">
                <div style="flex:1;overflow:hidden;min-width:0;">
                    <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:0.9rem;">${cleanTitle(s.name || s.title)}</div>
                    <div style="font-size:0.75rem;opacity:0.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${cleanArtist(getArtistName(s))}</div>
                </div>
            </div>
        `).join('');
        document.getElementById('playlistList').innerHTML = trackHTML;
        document.getElementById('queueOverlay').innerHTML = trackHTML;
    }

    function toggle() {
        if (audio.paused) {
            audio.play();
            document.getElementById('playIcon').className = "fas fa-pause";
        } else {
            audio.pause();
            document.getElementById('playIcon').className = "fas fa-play";
        }
    }

    function next() {
        if (currentIndex < playlist.length - 1) {
            play(currentIndex + 1);
        } else if (autoRecommendations && !isAlbumPlaylist) {
            albumComplete = true;
            if (playlist[currentIndex]) fetchRadio(playlist[currentIndex].id);
        }
    }

    function prev() { if (currentIndex > 0) play(currentIndex - 1); }
    function changeVol(v) { audio.volume = v; }

    function seekRange(val) {
        if (audio.duration) audio.currentTime = (val / 1000) * audio.duration;
    }

    function updateProgress() {
        const cur = audio.currentTime, dur = audio.duration;
        const pct = dur ? (cur / dur * 100) : 0;
        const range = document.getElementById('progressRange');
        if (range && !range.matches(':active')) {
            range.value = dur ? (cur / dur * 1000) : 0;
            range.style.setProperty('--prog', pct.toFixed(2) + '%');
        }
        document.getElementById('curTime').innerText = fmt(cur);
        document.getElementById('durTime').innerText = fmt(dur);
    }

    audio.ontimeupdate = () => {
        updateProgress();
        const cur = audio.currentTime, dur = audio.duration;
        // Prefetch when < 60s remaining AND ≤5 songs in queue
        if (autoRecommendations && !isAlbumPlaylist && !isFetching &&
            dur > 0 && (dur - cur) < 60 && shouldPrefetch()) {
            fetchRadio(playlist[currentIndex]?.id);
        }
        // Synced lyrics
        if (parsedLyrics.length > 0) {
            const activeLine = parsedLyrics.reduce((prev, curr) => (curr.time <= cur) ? curr : prev, null);
            if (activeLine) {
                document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
                activeLine.element.classList.add('active');
                activeLine.element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    };

    audio.onended = next;

    function fmt(s) {
        if (!s || isNaN(s)) return "0:00";
        const m = Math.floor(s / 60), sec = Math.floor(s % 60);
        return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    document.addEventListener('click', e => {
        if (!e.target.closest('.search-container')) document.getElementById('sugBox').style.display = 'none';
    });

    window.onload = () => loadTrendingPlaylist('telugu');

    // =============================================
    // ADMIN REMOTE CONTROL via postMessage
    // =============================================
    window.addEventListener('message', (e) => {
        // Accept both formats passenger.html sends:
        // { type: 'media-control', action: 'play' }  — from mediaControl()
        // { action: 'play' }                          — from Bluetooth handlers
        const action = e.data?.action || (e.data?.type === 'media-control' ? e.data?.action : null);
        if (!action) return;

        console.log('🎮 Admin remote command:', action);

        if (action === 'play') {
            audio.play();
            document.getElementById('playIcon').className = "fas fa-pause";
        }
        else if (action === 'pause') {
            audio.pause();
            document.getElementById('playIcon').className = "fas fa-play";
        }
        else if (action === 'playpause') {
            if (audio.paused) {
                audio.play();
                document.getElementById('playIcon').className = "fas fa-pause";
            } else {
                audio.pause();
                document.getElementById('playIcon').className = "fas fa-play";
            }
        }
        else if (action === 'mute') {
            audio.muted = !audio.muted;
        }
        else if (action === 'setVolume') {
            audio.volume = e.data.volume;
        }
        else if (action === 'next') {
            next();
        }
        else if (action === 'previous') {
            prev();
        }
    });

</script>
</body>
</html>
